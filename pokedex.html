
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex | PokéMundo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">🔴 PokéMundo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                <li class="nav-item"><a class="nav-link active" href="pokedex.html">Pokédex</a></li>
                <li class="nav-item"><a class="nav-link" href="regioes.html">Regiões</a></li>
                <li class="nav-item"><a class="nav-link" href="lendarios.html">Lendários</a></li>
            </ul>
        </div>
    </div>
</nav>

<main>
    <section class="page-banner">
        <div class="container">
            <span class="small-label">BIBLIOTECA DE TREINADORES</span>
            <h1>Pokédex</h1>
            <p>Encontre seu Pokémon favorito e descubra suas características.</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="filter-bar mb-4">
                <div class="row g-3">
                    <div class="col-md-7">
                        <label for="pokemonSearch" class="form-label fw-bold">Pesquisar por nome</label>
                        <input type="search" id="pokemonSearch" class="form-control"
                               placeholder="Ex.: Pikachu, Gengar, Eevee...">
                    </div>
                    <div class="col-md-5">
                        <label for="typeFilter" class="form-label fw-bold">Filtrar por tipo</label>
                        <select id="typeFilter" class="form-select">
                            <option value="">Todos os tipos</option>
                            <option value="normal">Normal</option>
                            <option value="fire">Fogo</option>
                            <option value="water">Água</option>
                            <option value="electric">Elétrico</option>
                            <option value="grass">Planta</option>
                            <option value="fighting">Lutador</option>
                            <option value="poison">Venenoso</option>
                            <option value="flying">Voador</option>
                            <option value="psychic">Psíquico</option>
                            <option value="ghost">Fantasma</option>
                            <option value="fairy">Fada</option>
                        </select>
                    </div>
                </div>
                <p id="resultCount" class="text-secondary small mt-3 mb-0" aria-live="polite"></p>
            </div>

            <div id="pokemonInfo" class="mb-4"></div>
            <div id="pokemonGrid" class="row g-4"></div>
        </div>
    </section>
</main>

<footer>
    <div class="container">
        <h3>🔴 PokéMundo</h3>
        <p>Continue explorando o universo Pokémon!</p>
        <p>Desenvolvido por Murilo Tagliari</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JS/scrypt.js"></script>
</body>
</html>
